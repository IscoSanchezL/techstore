(function(){
  var cv=document.getElementById('stars-canvas');
  if(!cv) return;
  var ctx=cv.getContext('2d'),stars=[],W,H;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.2,o:Math.random()*0.7+0.15,s:Math.random()*0.4+0.05,t:Math.random()*Math.PI*2,c:Math.random()<0.12?'rgba(0,229,255,':'rgba(255,255,255,'};}
  function init(){resize();stars=[];var n=Math.min(Math.floor((W*H)/4800),160);for(var i=0;i<n;i++)stars.push(mk());}
  function draw(){ctx.clearRect(0,0,W,H);for(var i=0;i<stars.length;i++){var s=stars[i];s.t+=s.s*0.05;var o=s.o*(0.55+0.45*Math.sin(s.t));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=s.c+o+')';ctx.fill();}if(!document.hidden)requestAnimationFrame(draw);}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)requestAnimationFrame(draw);});
  window.addEventListener('resize',init);init();draw();
})();

function compressImg(file,q){
  q=q||0.65;
  return new Promise(function(res){
    var c=document.createElement('canvas'),ctx=c.getContext('2d'),img=new Image();
    img.onload=function(){
      var m=700,r=Math.min(m/img.width,m/img.height,1);
      c.width=img.width*r;c.height=img.height*r;
      ctx.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    var fr=new FileReader();fr.onload=function(e){img.src=e.target.result;};fr.readAsDataURL(file);
  });
}

  var busqueda=React.useState('');
  // Carga paginada: las fotos viajan dentro de cada producto, asi que se piden de a PAGINA
  // y solo se descarga todo si el cliente busca, filtra o pulsa "Ver todos".
  var PAGINA=12;
  var lim=React.useState(PAGINA),hayMas=React.useState(false);

  React.useEffect(function(){
    var ref=lim[0]?db.ref('products').orderByKey().limitToLast(lim[0]):db.ref('products');
    function cb(snap){
      var lista=[],total=0;
      snap.forEach(function(c){
        total++;
        var v=c.val();
        if(!v||v.deleted) return;
        var o={id:c.key};Object.keys(v).forEach(function(x){o[x]=v[x];});
        lista.push(o);
      });
      prods[1](lista);hayMas[1](!!lim[0]&&total>=lim[0]);loading[1](false);
    }
    ref.on('value',cb);return function(){ref.off('value',cb);};
  },[lim[0]]);

  // Si el cliente busca o filtra, se necesita el catalogo completo
  React.useEffect(function(){
    if(lim[0]&&(busqueda[0].trim()||filtro[0]!=='todos')) lim[1](null);
  },[busqueda[0],filtro[0]]);

  React.useEffect(function(){
    var ref=db.ref('categories');

      var d=snap.val();
      cats[1](d?Object.keys(d).map(function(k){return {id:k,name:d[k].name,color:d[k].color||'#00e5ff'};}):[]);
    }
    ref.on('value',cb);return function(){ref.off('value',cb);};

      var m=h.match(/^#catalogo\/(.+)$/);
      if(m){
        var found=prods[0].find(function(p){return p.id===m[1];});
        if(found){sel[1](found);imgI[1](0);}
        else{
          // enlace compartido a un producto fuera de la primera pagina: se pide solo ese
          window.__pendingProductId=m[1];
          db.ref('products/'+m[1]).once('value').then(function(sn){
            var v=sn.val();
            if(v&&!v.deleted&&window.__pendingProductId===m[1]){
              var o={id:m[1]};Object.keys(v).forEach(function(x){o[x]=v[x];});
              sel[1](o);imgI[1](0);window.__pendingProductId=null;
            }

        }
      } else {sel[1](null);imgI[1](0);}
    }
    window.addEventListener('hashchange',onHash);
    onHash();
    return function(){window.removeEventListener('hashchange',onHash);};
  },[prods[0]]);

  React.useEffect(function(){

  function open(p){location.hash='#catalogo/'+p.id;sel[1](p);imgI[1](0);}
